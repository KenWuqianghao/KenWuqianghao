name: Chess cards

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - "chess/**"
      - ".github/workflows/chess-cards.yml"
  pull_request:
    paths:
      - "chess/**"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests (SAN replayer vs. 400 real games, analysis, rendering)
        working-directory: chess
        run: python -m unittest discover -s tests -t . -v

  render:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore Chess.com archive cache
        uses: actions/cache@v4
        with:
          path: chess/.cache
          key: chess-api-cache-${{ github.run_id }}
          restore-keys: chess-api-cache-
      - name: Render cards
        working-directory: chess
        run: python -m chess_cards --cache .cache --out output
      - name: Validate SVG
        run: |
          sudo apt-get install -y -qq libxml2-utils >/dev/null
          xmllint --noout chess/output/*.svg
      - name: Commit refreshed cards
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chess/output
          if git diff --cached --quiet; then
            echo "cards unchanged"
          else
            git commit -m "Refresh chess cards"
            git push
          fi
